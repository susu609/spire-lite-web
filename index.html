<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10151c"><title>Spire Lite — HTML5 Roguelike</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head>
<body><main id="app">
<header><div><strong>SPIRE LITE</strong><span class="sub">Card roguelike • Ultra Low Web</span></div><div class="bar"><button id="deckbutton">Bộ bài</button><button id="graphics">Đồ họa: THẤP</button><button id="restart">Chạy mới</button></div></header>
<section id="status" class="status"></section>
<section id="inventory" class="inventory panel"></section>
<section id="map" class="panel hidden"></section>
<section id="combat" class="hidden"><div class="battle"><article id="enemy" class="panel"></article><article id="hero" class="panel"></article></div><div id="log" aria-live="polite"></div><div class="row counter"><span id="deckinfo"></span><button id="endturn" class="primary">Kết thúc lượt</button></div><div id="hand" class="hand"></div></section>
<section id="event" class="panel hidden"></section>
<section id="shop" class="panel hidden"></section>
<section id="remove" class="panel hidden"></section>
<section id="rewards" class="panel hidden"></section>
<section id="upgrade" class="panel hidden"></section>
<section id="deckview" class="panel hidden"></section>
<section id="result" class="panel hidden"></section>
<footer>Fan-inspired prototype • Hình ảnh, tên lá bài và luật chơi tự tạo • Không sử dụng tài nguyên STS2</footer>
</main><script src="game.js" defer></script></body></html>
