name: Java foundation build
on:
  push:
    branches: [java-foundation]
    paths: ['core/**', 'lwjgl3/**', '**/*.gradle', 'gradle.properties', 'settings.gradle', '.github/workflows/java-ci.yml']
  pull_request:
    paths: ['core/**', 'lwjgl3/**', '**/*.gradle', 'gradle.properties', 'settings.gradle', '.github/workflows/java-ci.yml']
permissions:
  contents: read
jobs:
  build-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Test rules and compile desktop
        run: gradle :core:test :lwjgl3:classes --no-daemon
